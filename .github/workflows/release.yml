name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows App SDK workload
        run: dotnet workload install windows

      - name: Restore NuGet packages
        run: dotnet restore Jareth.sln

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "tag_version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate tag matches project version
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.version.outputs.tag_version }}"
          $csprojPath = "src/Jareth/Jareth.csproj"
          [xml]$csproj = Get-Content $csprojPath
          $projectVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($projectVersion -ne $tagVersion) {
            Write-Error "Tag version '$tagVersion' does not match project version '$projectVersion'. Update <Version> in Jareth.csproj."
            exit 1
          }
          Write-Host "Version match confirmed: $tagVersion"

      - name: Build solution
        run: dotnet build Jareth.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/Jareth.Tests --configuration Release --no-build --verbosity normal

      - name: Generate certificate
        shell: pwsh
        run: |
          # Use production cert if available, otherwise generate self-signed
          if ("${{ secrets.PROD_CERT_PFX }}" -ne "") {
            $bytes = [Convert]::FromBase64String("${{ secrets.PROD_CERT_PFX }}")
            [IO.File]::WriteAllBytes("${{ github.workspace }}/build-cert.pfx", $bytes)
            Write-Host "Using production certificate."
          } else {
            $certPassword = ConvertTo-SecureString -String "${{ secrets.CERT_PASSWORD }}" -Force -AsPlainText
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=JarethDev" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Jareth Release Cert" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            Export-PfxCertificate `
              -Cert $cert `
              -FilePath "${{ github.workspace }}/build-cert.pfx" `
              -Password $certPassword
            Write-Host "Using self-signed certificate."
          }

      - name: Build MSIX installer
        shell: pwsh
        run: |
          msbuild src/Jareth/Jareth.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir="${{ github.workspace }}/output/installer/" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:PackageCertificateKeyFile="${{ github.workspace }}/build-cert.pfx" `
            /p:PackageCertificatePassword="${{ secrets.CERT_PASSWORD }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jareth ${{ github.ref_name }}
          generate_release_notes: true
          files: output/installer/**/*.msix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
