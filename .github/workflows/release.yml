name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate version tag matches project version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          [xml]$csproj = Get-Content src/Jareth/Jareth.csproj
          $projectVersion = $csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $projectVersion) {
            Write-Error "Tag version ($tag) does not match project version ($projectVersion)"
            exit 1
          }
          Write-Host "Version validated: $tag"

      - name: Restore NuGet packages
        run: dotnet restore Jareth.sln

      - name: Build solution
        run: dotnet build Jareth.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/Jareth.Tests/Jareth.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build Unpackaged (portable EXE)
        shell: pwsh
        run: |
          dotnet publish src/Jareth/Jareth.csproj `
            --configuration Unpackaged `
            -p:RuntimeIdentifier=win-x64 `
            --self-contained true `
            -o "${{ github.workspace }}\output\portable"

      - name: Zip portable EXE
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}\output\portable\*" `
            -DestinationPath "${{ github.workspace }}\output\Jareth-portable-win-x64.zip"
          Write-Host "Created: ${{ github.workspace }}\output\Jareth-portable-win-x64.zip"

      - name: Generate signing certificate
        shell: pwsh
        run: |
          $prodCert = "${{ secrets.PROD_CERT_PFX }}"
          if ($prodCert) {
            $certPassword = "${{ secrets.CERT_PASSWORD }}"
            if ([string]::IsNullOrEmpty($certPassword)) {
              Write-Error "CERT_PASSWORD secret must be set when using PROD_CERT_PFX"
              exit 1
            }
            $bytes = [Convert]::FromBase64String($prodCert)
            [IO.File]::WriteAllBytes("${{ github.workspace }}\build-cert.pfx", $bytes)
            $securePassword = ConvertTo-SecureString -String $certPassword -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath "${{ github.workspace }}\build-cert.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
          } else {
            $cert = New-SelfSignedCertificate `
              -Type Custom `
              -Subject "CN=JarethDev" `
              -KeyUsage DigitalSignature `
              -FriendlyName "Jareth Release Certificate" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          }
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MSIX installer
        shell: pwsh
        run: |
          msbuild src/Jareth/Jareth.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageDir="${{ github.workspace }}\output\installer\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT `
            /p:AppxPackageSigningEnabled=true `
            /restore

      - name: List installer output directory
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== output\installer contents ==="
          if (Test-Path "${{ github.workspace }}\output\installer") {
            Get-ChildItem -Path "${{ github.workspace }}\output\installer" -Recurse | Select-Object FullName
          } else {
            Write-Host "Directory does not exist: ${{ github.workspace }}\output\installer"
          }
          Write-Host "=== Default AppPackages output ==="
          $defaultOut = "src\Jareth\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\AppPackages"
          if (Test-Path $defaultOut) {
            Get-ChildItem -Path $defaultOut -Recurse | Select-Object FullName
          } else {
            Write-Host "Directory does not exist: $defaultOut"
          }

      - name: Find MSIX output
        id: find_msix
        shell: pwsh
        run: |
          $searchDirs = @(
            "${{ github.workspace }}\output\installer",
            "${{ github.workspace }}\src\Jareth\bin"
          )
          $msix = $searchDirs |
            Where-Object { Test-Path $_ } |
            ForEach-Object { Get-ChildItem -Path $_ -Recurse -Include *.msix,*.msixbundle } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $msix) {
            throw "No .msix/.msixbundle found in output\installer or src\Jareth\bin directories."
          }
          "msix_path=$($msix.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Found package: $($msix.FullName)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.find_msix.outputs.msix_path }}
            ${{ github.workspace }}\output\Jareth-portable-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
