name: PR Build

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore Jareth.sln

      - name: Build solution
        run: dotnet build Jareth.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/Jareth.Tests/Jareth.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=JarethDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Jareth CI Build Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MSIX installer
        shell: pwsh
        run: |
          msbuild src/Jareth/Jareth.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir="${{ github.workspace }}\output\installer\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:PackageCertificateThumbprint=$env:CERT_THUMBPRINT `
            /p:AppxPackageSigningEnabled=true `
            /restore

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jareth-PR-${{ github.event.pull_request.number }}-installer
          path: ${{ github.workspace }}\output\installer\**\*.msix
          if-no-files-found: error
          retention-days: 7

      - name: Post PR comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **Build succeeded.** Download the installer from the [Actions artifacts tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            })

      - name: Post PR comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Build failed.** Check the [Actions log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
