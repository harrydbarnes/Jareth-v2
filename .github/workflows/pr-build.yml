name: PR Build

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows App SDK workload
        run: dotnet workload install windows

      - name: Restore NuGet packages
        run: dotnet restore Jareth.sln

      - name: Build solution
        run: dotnet build Jareth.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/Jareth.Tests --configuration Release --no-build --verbosity normal

      - name: Generate self-signed certificate
        id: cert
        shell: pwsh
        run: |
          $certPassword = ConvertTo-SecureString -String "${{ secrets.CERT_PASSWORD }}" -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=JarethDev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Jareth Build Cert" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-PfxCertificate `
            -Cert $cert `
            -FilePath build-cert.pfx `
            -Password $certPassword
          echo "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build MSIX installer
        shell: pwsh
        run: |
          msbuild src/Jareth/Jareth.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxPackageDir="${{ github.workspace }}/output/installer/" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:PackageCertificateKeyFile="${{ github.workspace }}/build-cert.pfx" `
            /p:PackageCertificatePassword="${{ secrets.CERT_PASSWORD }}"

      - name: Upload MSIX artefact
        uses: actions/upload-artifact@v4
        with:
          name: Jareth-PR-${{ github.event.pull_request.number }}-installer
          path: output/installer/**/*.msix
          retention-days: 7

      - name: Post PR comment on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '✅ **Build succeeded.** Download the installer from the [Actions artefacts tab](' +
                    `${context.payload.pull_request.html_url}/checks` + ').'
            });

      - name: Post PR comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ **Build failed.** Check the [Actions log](' +
                    `${context.payload.pull_request.html_url}/checks` + ') for details.'
            });
